name: P3 - Deploy UATdk

on: 
  workflow_dispatch:
    inputs:
      p1_run_id:
        description: "P1 Run ID containing artifact"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  deploy-uat:
    runs-on: ubuntu-latest
    environment: UAT
  
    steps:
     - name: UAT deployment start
       run: echo "Waiting for UAT deployment approval completed"
       
     - name: Download P1 artifact
       uses: actions/download-artifact@v8
       with:
         name: pilot-artifact
         github-token: ${{ github.token }}
         repository: ${{ github.repository }}
         run-id: ${{ inputs.p1_run_id }}
         path: artifact
         
      - name: Check artifact contents
        run: |
         mkdir -p deployment/uat
         cp -r artifact/* deployment/uat/
         echo "Artifact deployed to UAT"
         ls -R deployment/uat
        
        
        
        
        
         
  
     
     
     
     
         
 
 
  
